<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/neoliva-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Neoliva Dental Care - Integrated dental care with the latest technologies in Dokki, Giza. نيوليفا لطب الأسنان - رعاية أسنان متكاملة بأحدث التقنيات في الدقي" />
  <meta name="keywords"
    content="dental clinic, dentist, Dokki, Giza, Egypt, cosmetic dentistry, dental implants, orthodontics, عيادة أسنان, طبيب أسنان, الدقي, الجيزة" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preload" as="image" href="/preload-icon.png" fetchpriority="high">
  <style>
    /* Critical inline CSS for instant first paint */
    #root-loader {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #FAF9F6;
    }
    #root-loader img {
      width: 96px;
      height: 96px;
      object-fit: contain;
      animation: pulse-loader 1.5s ease-in-out infinite;
    }
    @keyframes pulse-loader {
      0%, 100% { opacity: 0.4; transform: scale(0.95); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
  </style>
  <title>Neoliva Dental Care | نيوليفا لطب الأسنان</title>
</head>

<body style="background-color: #FAF9F6;">
  <div id="root">
    <div id="root-loader">
      <img src="/preload-icon.png" alt="Loading..." width="96" height="96">
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
